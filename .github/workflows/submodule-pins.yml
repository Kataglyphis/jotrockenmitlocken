# .github/workflows/submodule-pins.yml
# This repository has two submodules - third_party/ANThology (a path dependency
# pubspec.yaml compiles against) and third_party/ContainerHub (which owns every
# shared gate) - and until this workflow existed, nothing asserted either sat at
# its recorded gitlink. A drifted submodule means the deploy job builds and ships
# something other than what is committed, and `git submodule status` marks it
# with a '+' that is easy to miss in a wall of CI output.
#
# The suite is ContainerHub's, run from the submodule rather than copied here:
# third_party/ContainerHub/shared/windows/tests/Submodule.Pins.Tests.ps1. It is
# repo-agnostic - it takes the superproject root as a parameter and asserts, for
# EVERY configured submodule, that it is checked out, sits at its recorded
# commit, and is pinned to a commit still reachable from its remote. Nothing here
# has to name ANThology or ContainerHub for them to be covered.
#
# Runner is windows-latest, not the ubuntu-26.04 the rest of this repo uses,
# because ContainerHub's run-pester-suite action installs Pester 3.4.0 by default
# and 3.4.0 is a Windows PowerShell-era module. The suite itself is
# version-agnostic (it asserts with `throw`, not `Should`), so this can move to a
# cheaper runner the day the action can be told a Core-compatible version.
name: Submodule Pins

on:
  push:
    branches: ["main", "develop"]
    paths:
      - '.gitmodules'
      - 'third_party/**'
      - '.github/workflows/submodule-pins.yml'
  pull_request:
    branches: ["main", "develop"]
    paths:
      - '.gitmodules'
      - 'third_party/**'
      - '.github/workflows/submodule-pins.yml'

permissions:
  contents: read

concurrency:
  group: submodule-pins-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pins:
    name: 📌 Submodule pins sit at their recorded commits
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      # The suite takes the repo root as a parameter and the composite action can
      # only pass a path, so the root comes through the environment. It would
      # fall back to GITHUB_WORKSPACE on its own; naming it here keeps the wiring
      # visible instead of implied.
      CONTAINERHUB_PIN_CHECK_REPO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # Without this the submodules are never checked out and the suite fails
          # on its own vacuity guard rather than passing on an empty tree.
          # Top-level only (the drift guard is non-recursive for the same
          # reason) and at the default depth, which is what makes the
          # reachability check exercise its shallow-clone escalation.
          submodules: true

      # @main, like every other ContainerHub action in this repo: the upstream is
      # pushed before the consumer change that needs it. The suite PATH, by
      # contrast, is read out of the checked-out submodule, so it moves only when
      # the ContainerHub gitlink is bumped.
      - name: Submodule pins sit at their recorded, restorable commits
        uses: Kataglyphis/ContainerHub/.github/actions/run-pester-suite@main
        with:
          path: third_party/ContainerHub/shared/windows/tests/Submodule.Pins.Tests.ps1
