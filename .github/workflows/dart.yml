# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Deploy website with all dependencies

env:
  LOCAL_ASSETS_FOLDER: "assets"

on:
  push:
    branches: ["main", "develop"]

jobs:
  # ---------------------------------------------------------------------------
  # Lint gates, entirely ANTfrastructure's: shellcheck over this repo's bash,
  # actionlint over its workflows, gitleaks over its working tree - all three
  # using the pinned, SHA-verified binaries ANTfrastructure bootstraps rather than a
  # second set installed here.
  #
  # Cheap and first-to-finish (no image pull, no Flutter build), and it covers
  # classes the deploy job cannot: bash only reports a quoting or
  # undefined-function bug when the line finally executes - inside a container,
  # mid-deploy - `yaml.safe_load` proves a workflow is valid YAML but not valid
  # Actions, and nothing here looked for committed credentials at all until now.
  #
  # `build` NEEDS this job on purpose. This workflow deploys to three live FTP
  # targets on every push; a lint gate that runs beside the deploy instead of
  # in front of it can only report a problem the world has already been served.
  # ---------------------------------------------------------------------------
  lint:
    name: 🧹 shell + workflow + secret lint
    runs-on: ubuntu-26.04
    steps:
      # ANTfrastructure is the only submodule these gates read, and `submodules:
      # true` is top-level only - ANThology comes along because it is also
      # top-level, which is fine and costs seconds. fetch-depth 1: nothing here
      # looks at history.
      - uses: actions/checkout@v7.0.1
        with:
          submodules: true
          fetch-depth: 1

      # uvx is how the shared aggregator runs ruff; the runner carries no uv.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      # One script, not three inline `run:` blocks. The `git ls-files` file-list
      # construction (a bare `**` does not recurse without `shopt -s globstar`),
      # the vacuity guard and the ANTfrastructure-pin preconditions used to live
      # here in YAML, which meant the gate that blocks this deploy could not be
      # reproduced locally at all. Both places now run
      # `bash scripts/run-lint-gates.sh`, which is now a thin wrapper over
      # ANTfrastructure's shared aggregator (linux/scripts/run-lint-gates.sh) that
      # three consumers share; the reasoning for each of the three gates lives
      # there, and the wrapper carries only this repo's exclude set.
      #
      # No `shell: bash` override: bash is the default on ubuntu runners and it
      # already runs with -e -o pipefail, so the script's exit status is the
      # step's - the same failure signal the three steps had.
      - name: Lint gates (shellcheck + actionlint + gitleaks)
        run: bash scripts/run-lint-gates.sh

  build:
    name: 🚀 Deploy website on push
    runs-on: ubuntu-26.04
    # The deploy job is gated on the lint job: see the block above `lint:`.
    needs: lint

    # NO `image:` ANYWHERE IN THIS JOB, and no CONTAINER_IMAGE env var either.
    # The tag used to be written here as a literal and passed to all seven
    # container steps; it now comes from ANTfrastructure's own single source of
    # truth - linux/scripts/01-core/versions.env composes
    # `${IMAGE_REGISTRY_PREFIX}:${CI_IMAGE_LINUX_TAG}`, the four container
    # composite actions carry that value as their `image` input DEFAULT, and
    # verify_ci_image_refs.py checks the copies against versions.env. An input
    # OMITTED gets the default; an input passed as an expression does not, so
    # `image: ${{ env.X }}` with X unset would hand the action an empty ref.
    # Omission is therefore the whole mechanism: a family-wide tag change lands
    # in one file in one repo and this lane follows without a commit.
    steps:
      # ANTfrastructure's shared prologue: reclaim disk, check out (submodules:
      # ANThology is a path dependency, ANTfrastructure owns the shared gates),
      # pull the image with retries. No registry credentials on purpose: this
      # repo has no GHCR_PAT, the action skips login on empty credentials, and
      # the image is public, so the anonymous pull works.
      - name: 🚚 Prepare CI host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@main
        with:
          fetch-depth: '0'
          submodules: recursive

      # Host, not container: the WebDAV sync is the one step needing repo
      # secrets and uv. The assets it fetches land in the workspace, so the
      # container steps below see them through the bind mount.
      #
      # setup-uv installs the tool; scripts/sync-webdav-content.sh does the work
      # (venv, python pin, WebDavClient install, download). That split is the
      # point: the venv/install half was inline here, so the step had no local
      # equivalent. The secrets go through `env:` rather than into the command
      # line - a password containing a quote or `$(...)` was a quoting bug in the
      # old interpolated `run:`.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Sync content from WebDAV
        env:
          WEBDAV_HOSTNAME: ${{ secrets.WEBDAV_HOSTNAME }}
          WEBDAV_USERNAME: ${{ secrets.WEBDAV_USERNAME }}
          WEBDAV_PASSWORD: ${{ secrets.WEBDAV_PASSWORD }}
          WEBDAV_REMOTE_BASE_PATH: ${{ secrets.REMOTE_BASE_PATH }}
          # LOCAL_ASSETS_FOLDER comes from the workflow-level env above.
        run: bash scripts/sync-webdav-content.sh

      # Every Dart/Flutter step runs inside the Kataglyphis container image
      # (Flutter baked in at /opt/flutter) - the host has no Flutter SDK any
      # more. One phase per step; the phases live in
      # scripts/ci-container-steps.sh, which re-establishes per-container
      # state (PATH, git safe.directory, pub cache) every time.

      # pub get (root + ANThology), format, analyze and test were four inline
      # steps here until they were folded into ANTfrastructure's shared gate. The
      # inline `dart format .` was the reason to move: a recursive walk cannot
      # tell vendored code from ours, so it format-checked third_party/ANThology
      # (a separate repo, 86 .dart files).
      - name: Dart checks (format, analyze, test)
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          extra-args: --platform "linux/amd64"
          script: bash /workspace/scripts/ci-container-steps.sh dart-checks

      # `flutter config --enable-web` moved into the build phases: it writes
      # per-user config, which the next step's fresh container never inherits.
      # Both branches build the SAME WASM bundle - the step names say so now;
      # "Build Web App" on main read as a non-WASM build in the runs UI and was
      # not one.
      - name: "Build Web App (WASM, main)"
        if: github.ref == 'refs/heads/main'
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          extra-args: --platform "linux/amd64"
          script: bash /workspace/scripts/ci-container-steps.sh build-web-wasm

      - name: "Build Web App (WASM, develop)"
        if: github.ref == 'refs/heads/develop'
        id: build-wasm
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          extra-args: --platform "linux/amd64"
          script: bash /workspace/scripts/ci-container-steps.sh build-web-wasm

      - name: 🔍 Integration smoke test
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          extra-args: --platform "linux/amd64"
          script: bash /workspace/scripts/ci-container-steps.sh smoke-test

      - name: 📂 Sync files to main domain
        if: github.ref == 'refs/heads/main'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.SERVER }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PW }}
          local-dir: "./build/web/"

      - name: 📂 Sync files to dev wasm domain
        if: github.ref == 'refs/heads/develop' #&& steps.build-wasm.outputs.should_run == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.SERVER }}
          username: ${{ secrets.DEV_WASM_USERNAME }}
          password: ${{ secrets.DEV_WASM_PW }}
          local-dir: "./build/web/"

      - name: "Build Web App with canavaskit"
        if: github.ref == 'refs/heads/develop'
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          extra-args: --platform "linux/amd64"
          script: bash /workspace/scripts/ci-container-steps.sh build-web-canvaskit

      - name: 📂 Sync files to dev domain
        if: github.ref == 'refs/heads/develop'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.SERVER }}
          username: ${{ secrets.DEV_USERNAME }}
          password: ${{ secrets.DEV_PW }}
          local-dir: "./build/web/"

      - name: Build docs
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@main
        with:
          extra-args: --platform "linux/amd64"
          script: bash /workspace/scripts/ci-container-steps.sh dart-doc

      - name: 📂 Sync files to doc domain
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.DOC_WEBSITE_SERVER }}
          username: ${{ secrets.DOC_WEBSITE_USER }}
          password: ${{ secrets.DOC_WEBSITE_PW }}
          local-dir: "./doc/api/"
