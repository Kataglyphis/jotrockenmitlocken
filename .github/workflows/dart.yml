# separate terms of service, privacy policy, and support
# documentation.

name: Deploy website with all dependencies

env:
  LOCAL_ASSETS_FOLDER: "assets"

on:
  push:
    branches: ["main", "develop"]

jobs:
  build:
    name: 🚀 Deploy website on push
    #runs-on: windows-latest
    runs-on: ubuntu-26.04
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Set up Python 3.14
        run: uv venv --python=3.14

      # You can test your matrix by printing the current Python version
      - name: Install WebDav Client and Sync content
        run: |
          uv pip install git+https://github.com/Kataglyphis/WebDavClient
          uv run python scripts/download_markdown_files.py ${{ secrets.WEBDAV_HOSTNAME }} ${{ secrets.WEBDAV_USERNAME }} ${{ secrets.WEBDAV_PASSWORD }} ${{ secrets.REMOTE_BASE_PATH }} "$LOCAL_ASSETS_FOLDER"

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@v4.3
        with:
          channel: stable
          version: 3.44.0

      # git submodule update --init --recursive
      - name: Install dependencies
        run: |
          flutter pub get
          cd third_party/ANThology
          flutter pub get

      # Verification order matches AGENTS.md: analyze → test → format
      - name: Analyze project source
        run: dart analyze

      - name: Run tests
        run: flutter test

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Enable flutter web
        run: |
          flutter config --enable-web

      - name: "Build Web App"
        if: github.ref == 'refs/heads/main'
        run: |
          flutter build web --release --wasm --no-tree-shake-icons

      - name: "Build Web App (WASM)"
        if: github.ref == 'refs/heads/develop'
        id: build-wasm
        run: |
          flutter build web --release --wasm --no-tree-shake-icons

      - name: 🔍 Integration smoke test
        run: |
          cd build/web
          python3 -m http.server 8080 --bind 127.0.0.1 &
          SERVER_PID=$!
          sleep 1
          cd ../..
          bash scripts/integration-smoke-test.sh http://localhost:8080
          RESULT=$?
          kill $SERVER_PID 2>/dev/null
          exit $RESULT

      - name: 📂 Sync files to main domain
        if: github.ref == 'refs/heads/main'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.SERVER }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PW }}
          local-dir: "./build/web/"

      - name: 📂 Sync files to dev wasm domain
        if: github.ref == 'refs/heads/develop' #&& steps.build-wasm.outputs.should_run == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.SERVER }}
          username: ${{ secrets.DEV_WASM_USERNAME }}
          password: ${{ secrets.DEV_WASM_PW }}
          local-dir: "./build/web/"

      - name: "Build Web App with canavaskit"
        if: github.ref == 'refs/heads/develop'
        run: |
          rm -r ./build/web/
          flutter build web --release --no-tree-shake-icons

      - name: 📂 Sync files to dev domain
        if: github.ref == 'refs/heads/develop'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.SERVER }}
          username: ${{ secrets.DEV_USERNAME }}
          password: ${{ secrets.DEV_PW }}
          local-dir: "./build/web/"

      - name: Build docs
        run: |
          dart doc

      - name: 📂 Sync files to doc domain
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.DOC_WEBSITE_SERVER }}
          username: ${{ secrets.DOC_WEBSITE_USER }}
          password: ${{ secrets.DOC_WEBSITE_PW }}
          local-dir: "./doc/api/"
