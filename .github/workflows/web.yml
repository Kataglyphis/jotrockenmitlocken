name: Web · build + deploy

env:
  LOCAL_ASSETS_FOLDER: "assets"

permissions:
  contents: read

on:
  push:
    branches: ["main", "develop"]

jobs:
  # Gates `build` (live FTP deploys); must match scripts/run-lint-gates.sh; a `uses:` job may not set timeout-minutes.
  lint:
    name: 🧹 lint gates
    uses: Kataglyphis/ANTfrastructure/.github/workflows/lint-gates.yml@develop
    with:
      # Top-level only: every scope excludes third_party, so nested submodules would be checked out for nothing.
      submodules: 'true'
      exclude: third_party
      # The freeze files are committed, so CI grades as much as the dev box does.
      ratchets: true

  build:
    name: 🚀 Deploy website on push
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    # The deploy job is gated on the lint job: see the block above `lint:`.
    needs: lint

    # No `image:` input: omitted, it defaults to the family ref; an expression that resolves empty would not.
    steps:
      # No registry credentials: the image is public and this repo has no GHCR_PAT.
      - name: 🚚 Prepare CI host
        uses: Kataglyphis/ANTfrastructure/.github/actions/prepare-linux-ci-host@develop
        with:
          fetch-depth: '0'
          submodules: recursive

      # On the host: the one step needing repo secrets, passed via env: so quotes in them cannot break the command.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Sync content from WebDAV
        env:
          WEBDAV_HOSTNAME: ${{ secrets.WEBDAV_HOSTNAME }}
          WEBDAV_USERNAME: ${{ secrets.WEBDAV_USERNAME }}
          WEBDAV_PASSWORD: ${{ secrets.WEBDAV_PASSWORD }}
          WEBDAV_REMOTE_BASE_PATH: ${{ secrets.REMOTE_BASE_PATH }}
          # LOCAL_ASSETS_FOLDER comes from the workflow-level env above.
        run: bash scripts/sync-webdav-content.sh

      # Flutter runs only in the image; each phase of scripts/ci-container-steps.sh re-establishes per-container state.
      - name: Dart checks (format, analyze, test)
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          extra-args: --platform "linux/amd64"
          script: bash /workspace/scripts/ci-container-steps.sh dart-checks

      # Both branches build the same WASM bundle.
      - name: "Build Web App (WASM, main)"
        if: github.ref == 'refs/heads/main'
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          extra-args: --platform "linux/amd64"
          script: bash /workspace/scripts/ci-container-steps.sh build-web-wasm

      - name: "Build Web App (WASM, develop)"
        if: github.ref == 'refs/heads/develop'
        id: build-wasm
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          extra-args: --platform "linux/amd64"
          script: bash /workspace/scripts/ci-container-steps.sh build-web-wasm

      - name: 🔍 Integration smoke test
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          extra-args: --platform "linux/amd64"
          script: bash /workspace/scripts/ci-container-steps.sh smoke-test

      # See third_party/ANTfrastructure/docs/ftp-deploys.md
      - name: 📂 Sync files to main domain
        if: github.ref == 'refs/heads/main'
        uses: Kataglyphis/ANTfrastructure/.github/actions/deploy-over-ftp@develop
        with:
          server: ${{ secrets.SERVER }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PW }}
          local-dir: "./build/web/"

      - name: 📂 Sync files to dev wasm domain
        if: github.ref == 'refs/heads/develop'
        uses: Kataglyphis/ANTfrastructure/.github/actions/deploy-over-ftp@develop
        with:
          server: ${{ secrets.SERVER }}
          username: ${{ secrets.DEV_WASM_USERNAME }}
          password: ${{ secrets.DEV_WASM_PW }}
          local-dir: "./build/web/"

      - name: "Build Web App with canavaskit"
        if: github.ref == 'refs/heads/develop'
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          extra-args: --platform "linux/amd64"
          script: bash /workspace/scripts/ci-container-steps.sh build-web-canvaskit

      - name: 📂 Sync files to dev domain
        if: github.ref == 'refs/heads/develop'
        uses: Kataglyphis/ANTfrastructure/.github/actions/deploy-over-ftp@develop
        with:
          server: ${{ secrets.SERVER }}
          username: ${{ secrets.DEV_USERNAME }}
          password: ${{ secrets.DEV_PW }}
          local-dir: "./build/web/"

      - name: Build docs
        uses: Kataglyphis/ANTfrastructure/.github/actions/run-in-linux-container@develop
        with:
          extra-args: --platform "linux/amd64"
          script: bash /workspace/scripts/ci-container-steps.sh dart-doc

      - name: 📂 Sync files to doc domain
        uses: Kataglyphis/ANTfrastructure/.github/actions/deploy-over-ftp@develop
        with:
          server: ${{ secrets.DOC_WEBSITE_SERVER }}
          username: ${{ secrets.DOC_WEBSITE_USER }}
          password: ${{ secrets.DOC_WEBSITE_PW }}
          local-dir: "./doc/api/"
