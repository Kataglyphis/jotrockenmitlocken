# Dependabot version updates for the pub ecosystem.
#
# STATUS (2026-09-07): kept, deliberately, alongside .github/renovate.json - and
# scheduled for removal, not silently already removed.
#
# The reasoning, so the next person does not have to redo it:
#
#   * Renovate's shared preset (github>Kataglyphis/ANTfrastructure, adopted in
#     .github/renovate.json) extends `config:recommended`, whose pub manager
#     covers exactly what this file covers - pubspec.yaml, weekly. So the two
#     bots overlap completely on this repo's ONLY Dependabot ecosystem.
#   * Renovate additionally covers what this file never did: the github-actions
#     references in .github/workflows/, and the git-submodules gitlinks for
#     third_party/ANThology and third_party/ANTfrastructure.
#   * Deleting this file therefore loses nothing - PROVIDED the Renovate GitHub
#     App is actually installed on this repository. That cannot be verified from
#     inside the repo, and a repo with neither bot running is strictly worse than
#     one with a redundant bot running. Dropping it on the assumption that
#     Renovate is live is exactly the kind of unverified step that leaves a
#     dependency gap nobody notices for months.
#
# REMOVAL CONDITION: delete this file once Renovate has opened its first PR (or
# its dependency dashboard issue) on jotrockenmitlocken. Until then the worst
# case is a duplicate pub PR, which is noise; the alternative worst case is no
# dependency updates at all, which is a silent regression.
#
# Configuration reference:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "pub" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
