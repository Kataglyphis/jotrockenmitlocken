name: jotrockenmitlocken
description: "Find out sth. interesting about me."
homepage: https://jonasheinle.de

# Prevent accidental publishing to pub.dev.
publish_to: "none"

version: 1.3.5

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  anthology:
    path: third_party/ANThology
  provider: ^6.1.5+1
  cupertino_icons: ^2.0.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  font_awesome_flutter: ^11.0.0
  sqlite3: ^3.7.0

dev_dependencies:
  # OmniAccelerANT's constraint; the layout test reads the router ANThology builds.
  go_router: ^18.0.0
  mockito: ^5.7.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#0B1220"
  image_path: "assets/icons/kataglyphis_app_icon.png"
  min_sdk_android: 21
  web:
    generate: true
    background_color: "#0B1220"
    theme_color: "#0B1220"

  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true

flutter:
  generate: true
  uses-material-design: true

  # App-only assets; the shared corpus and fonts come from anthology as `packages/anthology/...`.
  assets:
    # Filled at build time by sync-webdav-content.sh; a .gitkeep keeps each empty declared dir from failing the gate.
    - assets/documents/
    - assets/documents/books/
    - assets/documents/games/
    - assets/documents/thesis/
    - assets/documents/cv/
    - assets/data/
    - assets/settings/
    - assets/settings/user_settings/

  # The web engine fetches a family named exactly Roboto from fonts.gstatic.com unless the app declares one; ANThology's file, by path.
  fonts:
    - family: Roboto
      fonts:
        - asset: third_party/ANThology/assets/fonts/Roboto/Roboto-Regular.ttf

# The theme's fonts are anthology's, registered as `packages/anthology/<family>`.
