name: jotrockenmitlocken
description: "Find out sth. interesting about me."
homepage: https://jonasheinle.de

# Prevent accidental publishing to pub.dev.
publish_to: "none"

version: 1.3.5

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  anthology:
    path: third_party/ANThology
  provider: ^6.1.5+1
  cupertino_icons: ^1.0.9
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  go_router: ^17.2.3
  font_awesome_flutter: ^11.0.0
  sqlite3: ^3.3.1

dev_dependencies:
  mockito: ^5.7.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/barbell.png"
  min_sdk_android: 21
  web:
    generate: true

  windows:
    generate: true
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true

flutter:
  generate: true
  uses-material-design: true

  # The shared corpus (images, blog/footer documents, Montserrat + Roboto) now
  # lives in the anthology package and is referenced as
  # `packages/anthology/assets/...`. Only assets unique to this app remain here.
  assets:
    - assets/images/
    - assets/documents/
    - assets/documents/books/
    - assets/documents/games/
    - assets/documents/thesis/
    - assets/documents/cv/
    - assets/data/
    - assets/settings/
    - assets/settings/user_settings/

# NOTE: there is deliberately no `fonts:` key here any more. The block that used
# to follow sat at column 0 - a top-level pubspec key, which Flutter ignores -
# and every asset path in it (`static/Montserrat-Thin.ttf`, `Roboto-Black.ttf`,
# resolved from the repo root) pointed at a file that does not exist. Montserrat
# and Roboto are declared by the anthology package now, correctly nested under
# its own `flutter:` key, and register as `packages/anthology/<family>`.
